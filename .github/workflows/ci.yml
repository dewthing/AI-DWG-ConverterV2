name: Verify AI CAD Converter

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GRADIO_ANALYTICS_ENABLED: "False"
      HF_HUB_OFFLINE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tesseract language data
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-tha

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Verify source and run tests
        run: |
          python -m compileall -q app.py cad_converter cli.py run_colab.py
          python -c "from app import build_app; build_app()"
          python -m pytest -q

      - name: Build Render-compatible Docker image
        run: docker build --tag ai-dwg-converter:test .
